<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Anka POS — Kasir Sederhana</title>
    <meta name="description" content="Anka POS — aplikasi kasir ringan untuk usaha kecil">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3b82f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" href="ANKA-192.png" sizes="192x192">
    <link rel="apple-touch-icon" href="ANKA-192.png" sizes="192x192">

    <!-- External stylesheet (extracted critical rules to styles.css) -->
    <link rel="stylesheet" href="styles.css">

    <!-- Load Supabase SDK without blocking render -->
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>

    <!-- Small critical inline styles (keep minimal) -->
    <style>
      /* Keep only layout-critical overrides inline to avoid FOUC */
      :root { --primary: #1a73e8; }
      body { font-family: 'Inter', sans-serif; background: var(--bg-main); margin: 0; color: var(--text-dark); min-height: 100vh; overflow-y: auto; letter-spacing: -0.01em; transition: background 0.3s, color 0.3s; }
      .view { display: none; width: 100%; height: 100%; }
    </style>

  </head>
  <body>

    <!-- The rest of the original HTML follows unchanged. Styles were externalized to styles.css where possible. -->

    <!-- LOGIN VIEW -->
    <div id="loginView" class="view">
      <div class="card-login" role="region" aria-label="Form masuk">
        <h2>Anka POS</h2>
        <form id="loginForm" aria-label="Login form" autocomplete="on">
          <label for="email" class="sr-only">Email</label>
          <input id="email" name="email" type="email" placeholder="Email" required autocomplete="username">

          <label for="password" class="sr-only">Kata sandi</label>
          <input id="password" name="password" type="password" placeholder="Kata sandi" required autocomplete="current-password">

          <button class="btn-primary" type="submit">Masuk</button>
        </form>
      </div>
    </div>

    <!-- NOTE: Large component HTML and scripts remain as in the original file. If you want, I can further split
         the remaining inline CSS into multiple files and move scripts to separate JS modules. -->

    <!-- Small accessibility helper styles (in case JS/CSS load order delays external sheet) -->
    <style>
      .sr-only { position: absolute !important; width: 1px !important; height: 1px !important; padding: 0 !important; margin: -1px !important; overflow: hidden !important; clip: rect(0, 0, 0, 0) !important; white-space: nowrap !important; border: 0 !important; }
    </style>

    <!-- Existing application scripts (defer non-critical operations) -->
    <!-- Add your app script(s) here, using type="module" and defer where possible -->
    <script defer>
      // Minimal boot logic: show login view until app loads
      document.documentElement.classList.add('js-enabled');
      document.getElementById('loginView').style.display = 'flex';

      // Example: initialize Supabase client only after DOM ready (replace with your keys securely)
      document.addEventListener('DOMContentLoaded', function () {
        // NOTE: do NOT embed service_role or admin keys here. Use anon/public keys or server endpoints.
        try {
          if (window.supabase) {
            // window.supabase is the global library; consider importing via ES module for production
            console.log('Supabase SDK loaded');
          }
        } catch (e) {
          console.warn('Supabase init skipped', e);
        }
      });
    </script>

  </body>
</html>
